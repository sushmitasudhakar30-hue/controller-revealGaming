<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Controller Reveal 3D</title>
<link rel="stylesheet" href="/src/style.css">
</head><body data-mode="reveal">
<div id="wrap"><canvas id="c" width="1080" height="1920"></canvas></div>

<!-- scroll demo: one 100vh chapter per part (built in app.js) -->
<div id="scroller"></div>
<nav id="rail"></nav>
<div id="hint">SCROLL<i></i></div>

<!-- mode switch -->
<div id="modes"><button data-m="reveal" class="on">Reveal</button><button data-m="focus">Focus</button><button data-m="free">Free</button><button data-m="scroll">Scroll</button></div>

<!-- tools: finish swatches, tour, sound, screenshot -->
<div id="tools">
  <div id="swatches" role="group" aria-label="Finish"></div>
  <button id="tourBtn" title="Auto tour (T)">&#9654; Tour</button>
  <button id="sndBtn" title="Sound (M)">&#9835; Sound</button>
  <button id="shotBtn" title="Save PNG (S)">&#9711; Snap</button>
</div>
<div id="padBadge">GAMEPAD LIVE</div>
<div id="keys"><b>DRAG</b> orbit &nbsp;<b>WHEEL</b> zoom &nbsp;<b>0&ndash;6</b> focus &nbsp;<b>T</b> tour &nbsp;<b>M</b> sound &nbsp;<b>S</b> snap &nbsp;<b>R</b> reset &nbsp;<b>F</b> fullscreen</div>
<div id="snap"></div>

<!-- 3D spec cards -->
<div id="cards"></div>

<!-- focus-frame slider -->
<div id="fs">
  <div class="fs-head"><span id="fsName">OVERVIEW</span><span id="fsNum">00/06</span></div>
  <input id="fsr" type="range" min="0" max="6" step="0.01" value="0" aria-label="Focus frame">
  <div id="ticks"></div>
</div>

<!-- reveal-mode player -->
<div id="ui"><button id="pp">Pause</button><input id="sc" type="range" min="0" max="10" step="0.01" value="0"><span id="tt">0.0s</span></div>
<script type="module" src="/src/app.js"></script>
</body></html>
